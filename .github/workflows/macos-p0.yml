name: macOS P0 development probe

on:
  push:
    branches:
      - agents/cc-translate-macos-native
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p0:
    # The official macos-15 label is arm64; verify it again before any build.
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      archive_sha256: ${{ steps.seal.outputs.archive_sha256 }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - name: Check out development sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require the explicitly selected Apple Silicon toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test -d "$DEVELOPER_DIR"
          test "$(/usr/bin/xcodebuild -version | head -n 1)" = "Xcode 16.4"
          /usr/bin/xcodebuild -version
          /usr/bin/xcrun --sdk macosx --show-sdk-version
          /usr/bin/xcrun swift --version
          python3 --version
          python3 -c 'import sys; assert sys.version_info >= (3, 9), "Build harness requires Python 3.9+"'
      - name: Portable offline contract and packaging tests
        run: >-
          python3 -B -m unittest -v tests.test_macos_protocol tests.test_macos_bundle tests.test_macos_updates
          tests.test_macos_update_fixture
          tests.test_macos_performance
          tests.test_classify tests.test_is_single_word tests.test_direction tests.test_classify_import
          tests.test_prompts tests.test_provider_contracts tests.test_dictionary_store_portable
          tests.test_catalog_storage_portable
          tests.test_codex_config_darwin_contract tests.test_codex_catalog_darwin_contract
          tests.test_result_rules tests.test_storage
          tests.test_history tests.test_history_owner_contract
          tests.test_config_rules tests.test_config_store tests.test_config_owner_contract
          tests.test_macos_configuration
          tests.test_macos_history
          tests.test_request_snapshot
          tests.test_summary_rules tests.test_macos_translation tests.test_macos_claude_translation
          tests.test_macos_image
          tests.test_darwin_rpc_contract tests.test_darwin_print_contract tests.test_codex_darwin tests.test_codex_version
          tests.test_claude_jsonl tests.test_claude_darwin
          tests.test_codex_version_smoke
          tests.test_macos_runtime tests.test_macos_bundled_tests
          tests.test_macos_dictionary_fixture tests.test_macos_dictionary
      - name: Build and audit development-only bundle with pinned runtime
        run: python3 tools/macos/bundle.py build --development --build-number '${{ github.run_number }}'
      - name: Disposable signed Sparkle update lifecycle (not a release or TCC validation)
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/macos/update_fixture.py --app tools/macos/.build/CCTranslateMac-P0.app \
            --output tools/macos/.build/update-fixture 2>&1 | tee tools/macos/.build/update-fixture.log
      - name: Retain disposable update lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cc-translate-update-fixture-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            tools/macos/.build/update-fixture/*.json
            tools/macos/.build/update-fixture.log
      - name: Native Swift tests (not GUI or first-use TCC validation)
        id: native_units
        # Collect independent bundled checks too; the mandatory gate below still blocks publication.
        continue-on-error: true
        shell: bash
        env:
          CC_TRANSLATE_UI_SCREENSHOTS_DIR: ${{ github.workspace }}/tools/macos/.build/ui-screenshots
        run: |
          set -euo pipefail
          mkdir -p tools/macos/.build
          /usr/bin/xcrun swift build --package-path macos --triple arm64-apple-macosx14.0 --product CCTranslateMac 2>&1 | tee tools/macos/.build/native-unit-tests.log
          /usr/bin/xcrun swift build --package-path macos --triple arm64-apple-macosx14.0 --product CCClipboardTestProducer 2>&1 | tee -a tools/macos/.build/native-unit-tests.log
          /usr/bin/xcrun swift test --package-path macos --triple arm64-apple-macosx14.0 2>&1 | tee -a tools/macos/.build/native-unit-tests.log
      - name: Retain original native unit log before bundled lifecycle checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cc-translate-native-unit-log-${{ github.sha }}
          path: tools/macos/.build/native-unit-tests.log
          if-no-files-found: warn
          retention-days: 7
      - name: Retain native view renders, including failed-test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cc-translate-native-ui-${{ github.sha }}
          path: |
            tools/macos/.build/ui-screenshots/*.png
            tools/macos/.build/ui-screenshots/*.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Explicit pinned dictionary test input (Python fixture acquisition, not product URLSession)
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/cc-translate-dictionary-fixture.sqlite3"
          python3 -B tools/macos/dictionary_fixture.py --download-to "$fixture" --allow-download
          echo "CC_TRANSLATE_DICTIONARY_TEST_ASSET=$fixture" >> "$GITHUB_ENV"
      - name: Official pinned CLI version and native prewarm probes (no account or model)
        run: >-
          python3 -B tools/macos/codex_version_smoke.py
          --app tools/macos/.build/CCTranslateMac-P0.app
          --report tools/macos/.build/codex-version-smoke.json
      - name: Native URLSession dictionary install and model-to-offscreen-paint (not packaged GUI or keyboard)
        env:
          CC_TRANSLATE_APP: ${{ github.workspace }}/tools/macos/.build/CCTranslateMac-P0.app
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/xcrun swift test --package-path macos --triple arm64-apple-macosx14.0 \
            --filter DictionaryProductIntegrationTests 2>&1 | tee tools/macos/.build/dictionary-product-tests.log
          python3 -B tools/macos/runtime_matrix.py dictionary-product --directory tools/macos/.build \
            --source-sha '${{ github.sha }}' --run-id '${{ github.run_id }}'
          python3 -B tools/macos/performance.py --app tools/macos/.build/CCTranslateMac-P0.app \
            --asset "$CC_TRANSLATE_DICTIONARY_TEST_ASSET" --report tools/macos/.build/performance.json
      - name: Native About reader against complete bundled metadata and licenses (no app launch)
        env:
          CC_TRANSLATE_APP: ${{ github.workspace }}/tools/macos/.build/CCTranslateMac-P0.app
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/xcrun swift test --package-path macos --triple arm64-apple-macosx14.0 \
            --filter BundledAboutTests 2>&1 | tee tools/macos/.build/about-tests.log
          python3 -B tools/macos/runtime_matrix.py about --directory tools/macos/.build \
            --source-sha '${{ github.sha }}' --run-id '${{ github.run_id }}'
      - name: Native provider and repository owner lifecycle with bundled Python (synthetic only)
        run: >-
          tools/macos/.build/CCTranslateMac-P0.app/Contents/Resources/python/bin/python3 -I -B
          tools/macos/bundled_tests.py --app tools/macos/.build/CCTranslateMac-P0.app
          --suite process --report tools/macos/.build/process-tests.json
      - name: Native Foundation.Process to bundled helper integration (not optional here)
        env:
          CC_TRANSLATE_APP: ${{ github.workspace }}/tools/macos/.build/CCTranslateMac-P0.app
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/xcrun swift test --package-path macos --triple arm64-apple-macosx14.0 \
            --filter HelperIntegrationTests 2>&1 | tee tools/macos/.build/integration-tests.log
          python3 -B tools/macos/runtime_matrix.py integration --directory tools/macos/.build \
            --source-sha '${{ github.sha }}' --run-id '${{ github.run_id }}'
      - name: Explicit bundled helper HTTPS and SQLite smoke
        run: python3 tools/macos/smoke.py --allow-https
      - name: Shared rules and prompt contracts with bundled Python
        run: >-
          tools/macos/.build/CCTranslateMac-P0.app/Contents/Resources/python/bin/python3 -I -B
          tools/macos/bundled_tests.py --app tools/macos/.build/CCTranslateMac-P0.app
          --suite core --report tools/macos/.build/core-tests.json
      - name: Require native Swift unit success before archiving or publishing
        if: always()
        shell: bash
        env:
          NATIVE_UNIT_OUTCOME: ${{ steps.native_units.outcome }}
        run: |
          set -euo pipefail
          printf 'Native Swift unit test outcome: %s\n' "$NATIVE_UNIT_OUTCOME"
          test "$NATIVE_UNIT_OUTCOME" = success
      - name: Recheck immutable bundle and preserve executable modes in zip
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/macos/bundle.py verify
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            tools/macos/.build/CCTranslateMac-P0.app \
            tools/macos/.build/CCTranslateMac-P0.zip
      - name: Seal exact same-run archive identity and producer environment
        id: seal
        run: >-
          python3 -B tools/macos/runtime_matrix.py seal --directory tools/macos/.build
          --source-sha '${{ github.sha }}' --run-id '${{ github.run_id }}'
      - name: Retain synthetic development artifact only (not a Release)
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-arm64-p0-development-NOT-A-RELEASE
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
          path: |
            tools/macos/.build/CCTranslateMac-P0.zip
            tools/macos/.build/bundle-audit.json
            tools/macos/.build/helper-smoke.json
            tools/macos/.build/runtime-receipt.json
            tools/macos/.build/process-tests.json
            tools/macos/.build/core-tests.json
            tools/macos/.build/integration-tests.json
            tools/macos/.build/codex-version-smoke.json
            tools/macos/.build/dictionary-product-tests.json
            tools/macos/.build/performance.json
            tools/macos/.build/about-tests.json

  runtime:
    needs: p0
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            major: 14
            xcode: "16.2"
          - os: macos-26
            major: 26
            xcode: "26.6"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      PRODUCER_ARTIFACT_ID: ${{ needs.p0.outputs.artifact_id }}
    steps:
      - name: Check out the same workflow source SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require the runtime platform and preinstalled harness toolchain
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PRODUCER_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          /usr/bin/sw_vers
          uname -m
          test "$(uname -m)" = arm64
          test "$(/usr/bin/sw_vers -productVersion | cut -d. -f1)" = '${{ matrix.major }}'
          test -d "$DEVELOPER_DIR"
          test "$(/usr/bin/xcodebuild -version | head -n 1)" = 'Xcode ${{ matrix.xcode }}'
          /usr/bin/xcodebuild -version
          /usr/bin/xcrun swift --version
      - name: Download only the producer artifact ID from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.p0.outputs.artifact_id }}
          path: tools/macos/.build/received
          merge-multiple: true
      - name: Check the producer zip hash before extracting with modes and links
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.p0.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          test "${#EXPECTED_SHA256}" = 64
          cd tools/macos/.build/received
          test -f CCTranslateMac-P0.zip
          test ! -e CCTranslateMac-P0.app
          printf '%s  CCTranslateMac-P0.zip\n' "$EXPECTED_SHA256" | /usr/bin/shasum -a 256 -c -
          /usr/bin/ditto -x -k CCTranslateMac-P0.zip .
          test -x CCTranslateMac-P0.app/Contents/Resources/python/bin/python3
          test -x CCTranslateMac-P0.app/Contents/MacOS/CCTranslateMac
          test "$(readlink CCTranslateMac-P0.app/Contents/Resources/python/bin/python3)" = python3.12
      - name: Explicit pinned dictionary test input (Python fixture acquisition, not product URLSession)
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/cc-translate-dictionary-fixture.sqlite3"
          python3 -B tools/macos/dictionary_fixture.py --download-to "$fixture" --allow-download
          echo "CC_TRANSLATE_DICTIONARY_TEST_ASSET=$fixture" >> "$GITHUB_ENV"
      - name: Run the immutable producer app with this OS and a separate integration harness
        run: >-
          tools/macos/.build/received/CCTranslateMac-P0.app/Contents/Resources/python/bin/python3 -I -B
          tools/macos/runtime_matrix.py run --directory tools/macos/.build/received
          --output tools/macos/.build/runtime-evidence --source-sha '${{ github.sha }}'
          --run-id '${{ github.run_id }}' --archive-sha256 '${{ needs.p0.outputs.archive_sha256 }}'
          --os-major '${{ matrix.major }}' --xcode '${{ matrix.xcode }}' --allow-https
      - name: Retain only the small runtime evidence (never a second app archive)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.major }}-same-artifact-runtime-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            tools/macos/.build/runtime-evidence/runtime-report.json
            tools/macos/.build/runtime-evidence/process.json
            tools/macos/.build/runtime-evidence/core.json
            tools/macos/.build/runtime-evidence/helper-smoke.json
            tools/macos/.build/runtime-evidence/performance.json
