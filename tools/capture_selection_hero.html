<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CC Translate selection demo</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #172033;
      background:
        radial-gradient(circle at 15% 10%, #dce7ff 0, transparent 34%),
        linear-gradient(135deg, #f7f9fd, #edf1f8);
    }
    .browser {
      width: calc(100% - 72px);
      height: calc(100% - 64px);
      margin: 32px 36px;
      overflow: hidden;
      border: 1px solid #d8deea;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 22px 60px rgba(37, 48, 76, .16);
    }
    .chrome {
      height: 54px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 18px;
      border-bottom: 1px solid #e5e9f1;
      background: #f6f8fb;
    }
    .dot { width: 11px; height: 11px; border-radius: 50%; background: #cfd5e0; }
    .address {
      width: 500px;
      margin-left: 14px;
      padding: 8px 15px;
      border: 1px solid #dfe4ed;
      border-radius: 9px;
      color: #717b8e;
      background: #fff;
      font-size: 13px;
    }
    article {
      width: 760px;
      margin: 66px auto 0;
    }
    .eyebrow {
      margin-bottom: 16px;
      color: #5d6b85;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 26px;
      font-size: 42px;
      line-height: 1.16;
      letter-spacing: -.025em;
    }
    p {
      margin: 0 0 22px;
      color: #43506a;
      font-size: 21px;
      line-height: 1.65;
    }
    .selected {
      padding: 2px 3px 4px;
      color: #fff;
      background: #356fe4;
      border-radius: 3px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    .hint {
      position: absolute;
      left: 250px;
      top: 424px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 13px;
      border: 1px solid #dae1ee;
      border-radius: 10px;
      color: #59677f;
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 8px 24px rgba(45, 58, 87, .12);
      font-size: 14px;
      font-weight: 600;
    }
    kbd {
      padding: 4px 8px;
      border: 1px solid #cfd7e5;
      border-bottom-width: 2px;
      border-radius: 6px;
      color: #26324a;
      background: #f8faff;
      font: 600 13px "Segoe UI", sans-serif;
    }
    .cursor {
      position: absolute;
      left: 771px;
      top: 386px;
      width: 23px;
      height: 31px;
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .25));
    }
  </style>
</head>
<body>
  <main class="browser">
    <div class="chrome">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <div class="address">docs.example.com/productivity</div>
    </div>
    <article>
      <div class="eyebrow">Productivity guide</div>
      <h1>Designing software that feels instant</h1>
      <p>Fast tools respect attention. They keep common actions close and make every state easy to understand.</p>
      <p><span class="selected">A small change can make the whole workflow feel faster.</span></p>
    </article>
  </main>
  <div class="hint"><kbd>Ctrl+C</kbd><kbd>Ctrl+C</kbd><span>Double-tap to translate selection</span></div>
  <svg class="cursor" viewBox="0 0 24 32" aria-hidden="true">
    <path d="M2 1.5v23.8l6.3-5 4.4 9.2 4.1-2-4.3-8.9h8.2z" fill="#fff" stroke="#111827" stroke-width="1.6"/>
  </svg>
</body>
</html>
